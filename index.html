<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WTP — What’s That Phrase?</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">WTP</p>
        <h1>Find the word or phrase you can’t quite remember.</h1>
        <p class="subtitle">
          Describe the idea, feeling, or movie moment and WTP will suggest the
          closest match.
        </p>
      </section>

      <section class="card">
        <form id="wtpForm">
          <div class="field-row">
            <span class="field-label">This is a</span>
            <label class="choice">
              <input type="checkbox" name="type" value="word" checked />
              <span>Word</span>
            </label>
            <label class="choice">
              <input type="checkbox" name="type" value="phrase" />
              <span>Phrase</span>
            </label>
          </div>

          <div class="field-group">
            <label for="description">Describe your word</label>
            <textarea
              id="description"
              rows="5"
              placeholder="It means “having resentment” towards another. I remember it was from a movie with a character wearing a Guy Fawkes mask."
            ></textarea>
          </div>

          <button type="submit" class="submit-btn">Find it</button>
        </form>
      </section>

      <section class="result-card hidden" id="resultCard" aria-live="polite">
        <div class="result-header">
          <p class="result-label">WTP suggests</p>
          <h2 id="resultWord">...</h2>
        </div>
        <p id="resultDetail" class="result-detail"></p>

        <div class="feedback">
          <span>Was this the word or phrase you meant?</span>
          <div class="feedback-buttons">
            <button type="button" id="yesButton" class="pill yes">Yes</button>
            <button type="button" id="noButton" class="pill no">No</button>
          </div>
        </div>

        <p id="hintText" class="hint-text"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
